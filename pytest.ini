[pytest]
# Pytest configuration for AZMX brand utility script tests

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 3.8

# Output options
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Strict config (fail on unknown config options)
    --strict-config
    # Enable warnings
    -W default
    # Show captured output on failure
    --capture=no

# Console output styling
console_output_style = progress

# Markers for categorizing tests
markers =
    unit: Unit tests for individual functions
    integration: Integration tests across multiple components
    slow: Tests that take a long time to run
    requires_figma: Tests that require Figma API mocking
    requires_sips: Tests that require macOS sips command (image processing)
    requires_pillow: Tests that require PIL/Pillow library

# Ignore paths
norecursedirs =
    .git
    .auto-claude
    node_modules
    __pycache__
    *.egg-info
    .tox
    .venv
    venv
    build
    dist

# Coverage options (when using pytest-cov)
[coverage:run]
source = scripts
omit =
    */tests/*
    */conftest.py
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
