<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}} - AZMX Brand API</title>
    <meta name="description" content="{{description}}">
    <link rel="icon" href="{{favicon_path}}">

    <!-- Open Graph / Social Meta -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="AZMX Brand API Documentation">
    <meta property="og:title" content="{{title}} - AZMX Brand API">
    <meta property="og:description" content="{{description}}">
    <meta property="og:url" content="{{base_url}}">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{title}} - AZMX Brand API">
    <meta name="twitter:description" content="{{description}}">

    <!-- Redoc -->
    <script src="https://cdn.jsdelivr.net/npm/redoc@2.1.5/bundles/redoc.standalone.js"></script>

    <style>
        :root {
            --navy: #040038;
            --electric: #001AFF;
            --lightblue: #5D8FFF;
            --blue100: #DDE8FF;
            --blue200: #BFD5FF;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--navy);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        header {
            padding: clamp(48px, 9vw, 80px) clamp(24px, 5vw, 64px) 48px;
            max-width: 1400px;
            margin: 0 auto;
            border-bottom: 1px solid rgba(255, 255, 255, 0.14);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 0 0 28px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--lightblue);
        }

        .brand img {
            width: 18px;
            height: 18px;
        }

        .eyebrow {
            color: var(--lightblue);
            text-transform: uppercase;
            letter-spacing: 2.4px;
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 20px;
        }

        h1 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: clamp(36px, 6vw, 72px);
            font-weight: 400;
            letter-spacing: -2px;
            line-height: 1.02;
            margin: 0 0 24px;
        }

        .lede {
            color: var(--blue100);
            font-size: clamp(17px, 2vw, 21px);
            line-height: 1.65;
            max-width: 62ch;
            margin: 0 0 12px;
            opacity: 0.88;
        }

        .meta {
            color: var(--blue200);
            opacity: 0.7;
            font-size: 15px;
            margin: 20px 0 0;
        }

        .meta a {
            color: var(--lightblue);
            text-decoration: none;
        }

        .meta a:hover {
            text-decoration: underline;
        }

        code {
            background: rgba(255, 255, 255, 0.08);
            padding: 3px 8px;
            font-size: 13px;
            white-space: nowrap;
        }

        #redoc-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Redoc Theme Overrides */
        redoc {
            --navy: #040038;
            --electric: #001AFF;
            --lightblue: #5D8FFF;
            --blue100: #DDE8FF;
            --blue200: #BFD5FF;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <header>
        <p class="brand">
            <img src="{{logo_path}}" alt="AZMX">
            AZMX
        </p>
        <p class="eyebrow">API Documentation</p>
        <h1>{{title}}</h1>
        <p class="lede">{{description}}</p>
        <p class="meta">
            Version {{version}} ·
            <a href="{{spec_url}}" target="_blank">OpenAPI Spec</a> ·
            <a href="examples.html">Examples</a> ·
            <a href="{{github_url}}" target="_blank">GitHub</a>
        </p>
    </header>

    <div id="redoc-container"></div>

    <script>
        // Initialize Redoc with AZMX brand theme
        Redoc.init(
            '{{spec_path}}',
            {
                theme: {
                    colors: {
                        primary: {
                            main: '#5D8FFF'
                        },
                        success: {
                            main: '#22C36F'
                        },
                        warning: {
                            main: '#FED340'
                        },
                        error: {
                            main: '#FF2B3C'
                        },
                        text: {
                            primary: '#DDE8FF',
                            secondary: '#BFD5FF'
                        },
                        http: {
                            get: '#22C36F',
                            post: '#001AFF',
                            put: '#F47A48',
                            delete: '#FF2B3C',
                            patch: '#C68FFF'
                        }
                    },
                    typography: {
                        fontSize: '16px',
                        lineHeight: '1.65',
                        fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif',
                        headings: {
                            fontFamily: 'Georgia, "Times New Roman", serif',
                            fontWeight: '400'
                        },
                        code: {
                            fontSize: '14px',
                            fontFamily: 'Monaco, Consolas, "Courier New", monospace'
                        }
                    },
                    sidebar: {
                        backgroundColor: '#040038',
                        textColor: '#DDE8FF',
                        activeTextColor: '#5D8FFF',
                        groupItems: {
                            textTransform: 'uppercase',
                            letterSpacing: '1.6px',
                            fontSize: '11px'
                        }
                    },
                    rightPanel: {
                        backgroundColor: '#01006E',
                        textColor: '#DDE8FF'
                    }
                },
                scrollYOffset: 0,
                hideDownloadButton: false,
                expandResponses: '200,201',
                jsonSampleExpandLevel: 2,
                menuToggle: true,
                nativeScrollbars: false,
                pathInMiddlePanel: false,
                requiredPropsFirst: true,
                sortPropsAlphabetically: true,
                hideHostname: false,
                expandDefaultServerVariables: true,
                maxDisplayedEnumValues: 10
            },
            document.getElementById('redoc-container')
        );
    </script>
</body>
</html>
