name: Validate Generated Files

# azmx-tokens.css, tokens.html, index.html, references/image-index.md and
# references/recolor-prompts.md are build outputs. This job regenerates them
# with the documented commands and fails if the committed copies are stale.

on:
  push:
    paths:
      - 'assets/tokens/**'
      - 'scripts/**'
      - 'references/**'
      - 'scripts/image-meta.json'
      - 'scripts/image-tags.json'
      - 'scripts/recolor-prompts.json'
      - 'index.html'
      - 'tokens.html'
      - 'azmx-tokens.css'
      - '.github/workflows/validate-generated.yml'
  pull_request:
    # No paths filter: this is a required check under the main ruleset, so it must
    # report on every PR (path-filtered workflows never run and block the merge).

permissions:
  contents: read

jobs:
  generated-files-current:
    name: Generated files are current
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node dependencies (scripts/)
        run: cd scripts && npm ci

      - name: Validate token aliases
        run: node scripts/tokens-to-css.mjs --validate

      - name: Regenerate azmx-tokens.css
        # Documented in README.md / references/token-pipeline.md
        run: node scripts/tokens-to-css.mjs > azmx-tokens.css

      - name: Regenerate tokens.html
        run: node scripts/build-token-explorer.mjs > tokens.html

      - name: Regenerate index.html and references/image-index.md
        # Built from scripts/image-meta.json (the image catalogue); the JPEGs
        # live in the azmx-brand-cdn repository and are not needed here.
        run: python3 scripts/rebuild-index.py

      - name: Check reference files are synchronized
        run: python3 scripts/sync-references.py --check

      - name: Fail if committed generated files are stale
        run: |
          FILES="azmx-tokens.css tokens.html index.html references/image-index.md references/recolor-prompts.md"
          if ! git diff --quiet -- $FILES; then
            echo "::group::Diff of stale generated files"
            git --no-pager diff --stat -- $FILES
            git --no-pager diff -- $FILES | head -200
            echo "::endgroup::"
            for f in $(git diff --name-only -- $FILES); do
              echo "::error file=$f::$f is out of date. Regenerate it (see README.md) and commit the result."
            done
            echo "::error::Generated files are stale. Run: node scripts/tokens-to-css.mjs > azmx-tokens.css && node scripts/build-token-explorer.mjs > tokens.html && python3 scripts/rebuild-index.py"
            exit 1
          fi
          echo "All generated files are current."
