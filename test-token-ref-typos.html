<!DOCTYPE html>
<html>
<head>
  <style>
    /* Typos in token names - should be CAUGHT with suggestions */
    .typo-test-1 {
      /* Typo: 'txt' instead of 'text' */
      color: var(--azmx-txt-primary);
    }

    .typo-test-2 {
      /* Typo: 'surfase' instead of 'surface' */
      background: var(--azmx-surfase-page);
    }

    .typo-test-3 {
      /* Typo: missing dash in 'text-primary' */
      color: var(--azmx-textprimary);
    }

    .typo-test-4 {
      /* Typo: wrong number in color palette (555 instead of 500) */
      border-color: var(--azmx-color-blue-555);
    }

    .typo-test-5 {
      /* Typo: 'acent' instead of 'accent' */
      color: var(--azmx-acent-base);
    }

    .typo-test-6 {
      /* Typo: 'boarder' instead of 'border' */
      border-color: var(--azmx-boarder-default);
    }
  </style>
</head>
<body>
  <div>Typo tests</div>
</body>
</html>
