<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valid AZMX Brand Sample</title>
  <style>
    body {
      font-family: "AZM X Variable", sans-serif;
      color: #111927;
      background-color: #FFFFFF;
      margin: 24px;
      padding: 40px;
    }

    h1 {
      font-family: "Thmanyah Serif Display", serif;
      color: #040038;
      margin-bottom: 24px;
      padding-bottom: 16px;
    }

    .accent {
      color: #001AFF;
    }

    .card {
      background-color: #F0F5FF;
      padding: 24px;
      margin: 16px;
      border-radius: 8px;
    }

    .button {
      background-color: #001AFF;
      color: #FFFFFF;
      padding: 16px 24px;
      margin: 8px;
      gap: 8px;
    }

    .dark-section {
      background-color: #040038;
      color: #FFFFFF;
      padding: 64px;
      margin: 40px;
    }

    .dark-accent {
      color: #5D8FFF;
    }
  </style>
</head>
<body>
  <h1>AZMX Brand Valid Sample</h1>
  <div class="card">
    <p class="accent">This uses Electric blue (#001AFF) on white - valid!</p>
    <button class="button">Valid Button</button>
  </div>
  <div class="dark-section">
    <h2 class="dark-accent">Light Blue on Dark</h2>
    <p>This uses Light Blue (#5D8FFF) on dark surface - valid!</p>
  </div>
</body>
</html>
